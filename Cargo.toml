[package]
name = "deepseek-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A Rust CLI to chat with DeepSeek"
license = "MIT"
repository = "https://github.com/batusaribay/deepseek-chat"
publish = false

[[bin]]
name = "deepseek-chat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chromiumoxide = "0.9"
clap = { version = "4", features = ["derive"] }
dirs = "7"
futures = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
rustyline = "19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
