[package]
name = "deepseek-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Chat with DeepSeek in your terminal, through your own browser"
license = "MIT"
repository = "https://github.com/batusaribay/deepseek-chat"
publish = false

[[bin]]
name = "deepseek-chat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chromiumoxide = "0.9"
clap = { version = "4", features = ["derive"] }
dirs = "7"
futures = "0.3"
rustyline = "19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1"
